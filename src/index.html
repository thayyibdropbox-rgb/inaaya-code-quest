<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INAAYA – THE CODE QUEST 🚀</title>
<meta name="description" content="ഇനായയുടെ മലയാളം കോഡിംഗ് സാഹസിക ഗെയിം – Malayalam coding adventure for kids">
<meta name="author" content="Thayyib Haneefa – RIZTHA Technologies & Innovations">
<meta name="theme-color" content="#62cdf5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/*FONTS*/
:root{--ink:#1d2b3a;--muted:#5c6b7a;--pri:#ff7a2f;--pri2:#ffb347;--card:#ffffffee;--r:18px;--bg:#bfeea6;--tile:#eafbe0;--edge:#7cc35b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Baloo Chettan 2','Noto Sans Malayalam','Nirmala UI','Kartika','Malayalam Sangam MN',system-ui,sans-serif;color:var(--ink);background:#fdf6e9}
body{overscroll-behavior:none}
#app{max-width:1200px;margin:0 auto;min-height:100vh}
button{font-family:inherit;color:inherit}
small{font-size:.75em;opacity:.8}
.btn{border:0;border-radius:14px;padding:10px 16px;font-size:1.05rem;font-weight:700;background:#fff;box-shadow:0 4px 0 #0002;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
.btn:disabled{opacity:.45}
.btn.primary{background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;text-shadow:0 1px 0 #0003}
.btn.big{width:100%;font-size:1.25rem;padding:14px;flex-direction:column;margin:8px 0}
.btn.big small{display:block;font-weight:500;font-size:.8rem}
.btn.small{min-height:36px;padding:6px 12px;font-size:.95rem}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{background:#e2463b;color:#fff}
.btn.run{background:linear-gradient(180deg,#5ee07a,#21b04a);color:#fff;font-size:1.2rem;flex:1.4}
.btn.hint{background:#fff3b0}
.ib{border:0;background:#fff9;border-radius:12px;font-size:1.3rem;min-width:44px;min-height:44px;cursor:pointer}
.pill{background:#fff9;border-radius:99px;padding:4px 10px;font-weight:700;white-space:nowrap}
.top{display:flex;align-items:center;gap:8px;padding:8px;position:sticky;top:0;z-index:20;background:#fdf6e9ee;backdrop-filter:blur(4px)}
.top .ttl{flex:1;font-weight:800;font-size:1.05rem;line-height:1.2}
.tright{display:flex;gap:4px;align-items:center}
.muted{color:var(--muted)}.note{text-align:center;color:var(--muted);padding:8px 16px}
.center{text-align:center;padding:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px;box-shadow:0 6px 18px #0001}
/* robo */
.robo-svg{width:100%;height:100%;display:block}
.robo-svg .bulb{animation:blink 1.6s infinite}
.robo-svg .eyes{animation:eyes 4s infinite;transform-origin:50px 44px}
@keyframes blink{50%{fill:#ffd34d}}@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* home */
.home{min-height:100vh;padding:12px 16px 30px;background:radial-gradient(circle at 50% 0,#fff8,transparent 60%),var(--bg);max-width:560px;margin:0 auto}
.home-top{display:flex;justify-content:flex-end;gap:6px}
.logo{text-align:center;font-size:2.3rem;line-height:1;margin:10px 0;color:#ff5c8a;text-shadow:3px 3px 0 #fff,5px 5px 0 #0001;letter-spacing:2px}
.logo span{font-size:1.1rem;color:#2b86b8;letter-spacing:1px}
.hero{display:flex;align-items:center;gap:10px}
.hero svg{width:110px;height:110px;flex:none;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{background:#fff;border-radius:18px;padding:12px;position:relative;font-size:1.1rem;box-shadow:0 4px 10px #0001}
.bubble:before{content:'';position:absolute;left:-10px;top:24px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.timer{margin:10px 0;font-weight:700;text-align:center}
.timer .bar{display:block;height:10px;background:#fff8;border-radius:9px;overflow:hidden;margin-top:4px}
.timer .bar i{display:block;height:100%;background:linear-gradient(90deg,#5ee07a,#ffd34d)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.credit{text-align:center;font-size:.85rem;color:#3a4a5a;margin:14px 0 4px}
.progress-line{text-align:center;margin:10px 0}
/* map */
.map{padding:8px}
.world{background:var(--bg);border:3px solid var(--edge);border-radius:22px;padding:10px;margin:12px 4px}
.world h2{margin:4px 6px}
.week{background:#fff9;border-radius:14px;padding:8px;margin:8px 0}
.wk-t{font-weight:700;margin-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayb{border:0;border-radius:14px;background:#fff;min-height:58px;font-size:1.25rem;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px}
.dayb small{font-size:.6rem;font-weight:600}
.dayb.done{background:#ffe680}.dayb.locked{opacity:.5;cursor:default}.dayb.opt{background:#f3e9ff}.dayb.opt.done{background:#ffe680}
/* day */
.day{min-height:100vh;background:var(--bg);padding-bottom:20px}
.lh{font-weight:800;color:#2b86b8;margin-bottom:6px}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#2b86b8;color:#fff;margin-right:4px}
.learn h2{margin:6px 0}
.learn-body{display:flex;gap:10px;align-items:flex-start;font-size:1.15rem;line-height:1.6}
.mini-robo{width:72px;height:72px;flex:none;animation:bob 2s infinite}
.term{background:#e8f6ff;border-left:6px solid #2b86b8;padding:8px 12px;border-radius:10px;margin-top:8px;font-size:1.1rem}
.assess-note{background:#fff3b0;padding:8px;border-radius:10px}
.missions{display:grid;gap:8px}
.mcard{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;background:#fff;padding:12px;font-size:1.1rem;font-weight:700;box-shadow:0 4px 0 #0002;cursor:pointer;text-align:left}
.mcard .mi{font-size:1.6rem}.mcard .ms{margin-left:auto}.mcard.done{background:#eaffd8}.mcard:disabled{opacity:.5}
/* play */
.play,.maker{background:var(--bg);min-height:calc(100vh - 60px);padding:6px 8px 20px}
.story{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;font-size:1.02rem;line-height:1.45;box-shadow:0 3px 8px #0001}
.story .sr{font-size:1.5rem}
.status{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 4px;font-weight:700;min-height:34px}
#blkCount.over{color:#e2463b}
.tl{display:inline-flex;gap:3px;background:#333;padding:3px 5px;border-radius:9px}
.tl i{width:16px;height:16px;border-radius:50%;background:#555}
.tl.red .r{background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}.tl.green .g{background:#3bff6a;box-shadow:0 0 8px #3bff6a}
.board-wrap{display:flex;justify-content:center;padding:4px}
#board,.mboard{box-sizing:content-box;position:relative;display:grid;border:4px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--tile);box-shadow:0 6px 0 #0002}
.mboard{display:grid}
.cell{width:var(--cs);height:var(--cs);display:grid;place-items:center;font-size:calc(var(--cs)*.58);background:var(--tile);position:relative}
.cell.alt{background:color-mix(in srgb,var(--tile) 88%,var(--edge))}
.cell .ob{filter:drop-shadow(0 2px 0 #0003)}
.coin{animation:spin 2s infinite;display:inline-block}.coin.got{animation:pop .4s forwards}
@keyframes spin{50%{transform:scaleX(.6)}}@keyframes pop{to{transform:scale(2) translateY(-20px);opacity:0}}
.goal-ic{animation:bob 1.5s infinite;display:inline-block}
.robo{position:absolute;left:0;top:0;transition:transform .35s cubic-bezier(.4,1.4,.6,1);z-index:5;padding:6%;pointer-events:none}
.robo.hop svg{animation:hop .3s}.robo.bump svg{animation:bumpk .45s}.robo.waiting svg{animation:wiggle .4s}
@keyframes hop{50%{transform:translateY(-18%)}}
@keyframes bumpk{30%{transform:translate(var(--bx),var(--by)) rotate(-8deg)}60%{transform:translate(calc(var(--bx)*-.4),calc(var(--by)*-.4)) rotate(6deg)}}
@keyframes wiggle{33%{transform:rotate(-8deg)}66%{transform:rotate(8deg)}}
.chest{width:70%;height:62%;position:relative}
.chest .box{position:absolute;bottom:0;left:0;right:0;height:62%;background:linear-gradient(#c97b2a,#9b5512);border-radius:3px 3px 6px 6px;border:2px solid #6b3a0b}
.chest .box i{position:absolute;left:42%;top:10%;width:16%;height:40%;background:#ffd34d;border-radius:2px;border:1px solid #a87b00}
.chest .lid{position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(#e0913c,#b9681d);border-radius:40% 40% 3px 3px;border:2px solid #6b3a0b;transform-origin:50% 100%;transition:transform .5s}
.chest.open .lid{transform:translateY(-40%) rotateX(70deg)}
.chest.open .box{box-shadow:0 -10px 20px #ffe066}
.evbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px}
.evbtn{width:70px;height:70px;border-radius:50%;border:4px solid #fff;font-size:2rem;cursor:pointer;box-shadow:0 5px 0 #0003;background:#fff}
.evbtn.pressed{transform:scale(.9)}
.controls{display:flex;gap:6px;padding:6px 0}
.controls .btn{flex:1;padding:8px 6px}
.pal-title{font-weight:800;margin:6px 4px}.pal-title small{font-weight:500;display:block}
.palette{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#fff8;border-radius:14px;border:2px dashed transparent}
.palette.trash{border-color:#e2463b;background:#ffdcd8}
.workspace{background:#ffffffd9;border-radius:14px;padding:8px;min-height:180px;margin:8px 0}
.script{margin-bottom:10px}
.hat{background:#2b86b8;color:#fff;border-radius:12px 12px 4px 4px;padding:6px 12px;display:inline-block;font-size:1rem}
.hat.ev{background:#8a5cf5}
.list{min-height:48px;padding:4px 4px 8px 10px;border-left:4px solid #2b86b833;border-radius:0 0 8px 8px}
.list.target{background:#fff3b0aa;border-left-color:#ffb300}
.list.hover{background:#d9f2ffaa}
.here{font-size:.8rem;color:#a07000;padding:2px 6px}
.ins{height:6px;background:#ff7a2f;border-radius:3px;margin:2px 0}
.blk{display:flex;align-items:center;gap:6px;border-radius:12px;padding:6px 8px;margin:4px 0;color:#fff;font-weight:700;box-shadow:0 3px 0 #0003;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;min-height:44px;position:relative}
.blk .bi{font-size:1.3rem}.blk .bl{line-height:1.05}.blk .bl small{display:block;font-size:.65rem;letter-spacing:.5px}
.pal.blk{margin:0}
.t-R,.t-L,.t-U,.t-D{background:#3b9dea}.t-WAIT{background:#f2a33a}.t-REPEAT{background:#f2c23a;color:#3a2a00}.t-IF,.t-IFELSE{background:#ef6aa6}.t-EVENT{background:#8a5cf5}
.blk.cont{display:block;padding:4px 6px 6px}
.bh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.bh.else{margin-top:4px}
.blk.cont>.list{background:#ffffffcc;border-radius:10px;margin-top:4px;border-left-color:#0002}
.blk.cont>.list.target{background:#fff3b0}
.x{margin-left:auto;border:0;background:#0003;color:#fff;border-radius:50%;width:30px;height:30px;font-size:.9rem;cursor:pointer;flex:none}
.cnt{display:inline-flex;align-items:center;gap:4px;background:#fff8;border-radius:10px;padding:2px}
.cnt button{border:0;background:#fff;border-radius:8px;width:30px;height:30px;font-size:1.2rem;font-weight:800;cursor:pointer}
.cnt b{min-width:20px;text-align:center;font-size:1.2rem}
.cond,.evc{border:0;background:#fff;border-radius:10px;padding:5px 8px;font-weight:700;cursor:pointer;font-size:.9rem;color:var(--ink)}
.evc{font-size:1.3rem;padding:2px 8px}
.blk.running{outline:4px solid #ffe066;outline-offset:1px}
.blk.err{outline:4px solid #ff3b3b;animation:shake .4s}
.blk.yes>.bh{background:#5ee07a55;border-radius:8px}.blk.no>.bh{background:#ff3b3b44;border-radius:8px}
.blk.flash{animation:flash .5s 8}
@keyframes flash{50%{outline:5px solid #ffd000;transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.blk.dragging{opacity:.35}
.dragghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.9;min-width:120px;transform-origin:0 0;box-shadow:0 10px 20px #0004}
/* maker */
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.tool{border:0;background:#fff;border-radius:14px;min-width:62px;min-height:62px;font-size:1.6rem;cursor:pointer;box-shadow:0 3px 0 #0002;display:flex;flex-direction:column;align-items:center}
.tool small{font-size:.65rem}.tool.on{outline:4px solid #ff7a2f}
.mk-robo{width:85%;height:85%}
.reqs{background:#fff;border-radius:12px;padding:8px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.95rem}
.reqs .ok{color:#178a35}.namef{display:block;margin:10px 0;font-weight:700}
.namef input,.set input:not([type=checkbox]){font:inherit;padding:8px;border-radius:10px;border:2px solid #ccc;width:100%;max-width:340px}
.games{padding:12px;max-width:640px;margin:auto}
.gcard{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:10px;margin:8px 0;gap:8px}
.gcard small{display:block}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:#0006;z-index:100;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:22px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center;font-size:1.1rem;line-height:1.5;animation:popin .25s}
.modal h2,.modal h3{margin:6px 0}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal.quiz .mbtns .btn{background:#e8f6ff}
.modal .tell{background:#fff3b0;border-radius:12px;padding:8px}
.mrobo{width:90px;height:90px;margin:auto;animation:bob 2s infinite}.mrobo.sad{animation:wiggle 1s 2}
.reward{display:flex;justify-content:center}.reward .chest{width:110px;height:90px}
.stars{font-size:2.4rem;letter-spacing:4px}
.adapt{background:#e8ffe8;border-radius:10px;padding:6px}
.sol{text-align:left;background:#f5f5ff;border-radius:12px;padding:10px;font-family:inherit;font-size:1rem}
.pin{font-size:1.6rem;text-align:center;letter-spacing:8px;width:100%;padding:8px;margin:6px 0;border-radius:12px;border:2px solid #ccc}
.modal input{font:inherit;width:100%;padding:8px;margin:4px 0;border-radius:10px;border:2px solid #ccc}
.big-quote{font-size:1.25rem;font-weight:800;color:#ff5c8a}
@keyframes fade{from{opacity:0}}@keyframes popin{from{transform:scale(.8);opacity:0}}
#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.toast{background:#1d2b3a;color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:0 6px 18px #0004;animation:popin .2s;transition:opacity .4s}
.toast.out{opacity:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(40px)}}
/* parent */
.parent-top{background:#2b3a4a;color:#fff}.parent-top .ib{background:#fff3}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:#2b3a4a}
.tabs button{border:0;border-radius:10px;padding:8px 12px;background:#fff2;color:#fff;font-weight:700;white-space:nowrap;cursor:pointer}
.tabs button.on{background:#fff;color:#2b3a4a}
.dash{padding:12px;font-family:system-ui,'Baloo Chettan 2',sans-serif;max-width:980px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 6px #0001}.kpi b{display:block;font-size:1.5rem}.kpi span{color:var(--muted);font-size:.85rem}
.bars{display:flex;gap:4px;align-items:flex-end;height:140px;background:#fff;border-radius:14px;padding:10px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.bcol i{display:block;width:100%;background:#62cdf5;border-radius:4px 4px 0 0;min-height:2px}.bcol i.goal{background:#21b04a}.bcol small{font-size:.65rem}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:.9rem}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.mbar{display:inline-block;width:80px;height:8px;background:#eee;border-radius:4px;overflow:hidden;vertical-align:middle}.mbar i{display:block;height:100%;background:#21b04a}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.skill{background:#fff;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;border-left:8px solid #ccc}
.skill.st-indep{border-color:#21b04a}.skill.st-help{border-color:#f2c23a}.skill.st-practice{border-color:#e2463b}
.recs li{margin:4px 0}
.set{background:#fff;border-radius:12px;padding:10px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.danger-zone{border:2px solid #e2463b}
details{background:#fff;border-radius:10px;padding:8px;margin:6px 0}
.report{display:none}
/* certificate */
.cert{padding:16px}.cert-in{background:#fffdf2;border:10px double #d4a017;border-radius:20px;padding:20px;text-align:center;max-width:640px;margin:auto}
.cert-robo{width:90px;height:90px;margin:auto}.cert h2{font-size:2.2rem;color:#ff5c8a;margin:6px}.cert-sk{text-align:left;display:inline-block}
/* desktop */
@media (min-width:900px){
 .play{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:14px;align-items:start}
 .pright{position:sticky;top:66px}
 .workspace{max-height:56vh;overflow:auto}
}
@media print{
 body{background:#fff}.top,.tabs,#toasts,.center{display:none!important}
 body[data-screen=parent] #app>*:not(#report){display:none!important}
 body[data-screen=parent] .report{display:block!important;font-family:system-ui,'Baloo Chettan 2',sans-serif}
}
</style>
</head>
<body>
<div id="app"></div><div id="modals"></div><div id="toasts"></div>
